name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build (static linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v2 \
            go build -trimpath -tags netgo,osusergo -ldflags "-s -w -buildid=" \
            -o bin/tg-triage-linux-amd64 ./cmd/tgtriage

      - name: Check static linking
        run: file bin/tg-triage-linux-amd64 | grep -q 'statically linked'
