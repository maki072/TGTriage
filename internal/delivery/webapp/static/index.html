<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>Хелпдеск</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="devBanner" class="dev-banner" hidden>Локальный режим — открыто вне Telegram</div>

<header id="topbar" class="tr-topbar">
  <button id="backBtn" class="tr-iconbtn" hidden aria-label="Назад" title="Назад"></button>
  <div class="tr-topbar__title"><h1 id="topTitle">Загрузка…</h1><p id="topSub" hidden></p></div>
  <div id="topActions"></div>
</header>

<main id="app"><div class="tr-loading">Загрузка…</div></main>

<div id="bottom"></div>

<div id="toast" class="tr-toast" role="status" hidden></div>
<div id="modalRoot"></div>

<script src="ui.js"></script>
<script src="screens.js"></script>
<script src="settings.js"></script>
<script src="app.js"></script>
</body>
</html>
